# A free Render service goes to sleep after 15 minutes without visitors, and waking it takes 30-60 seconds.
# Opening it every 10 minutes keeps it awake (750 free instance hours a month cover a whole 31-day month).
# GitHub may start scheduled jobs a few minutes late, so a long quiet spell can still let it sleep: open the site
# yourself before a presentation. GitHub also pauses scheduled jobs in a repo with no commits for 60 days:
# then re-enable it in the Actions tab.
# Needs one repo variable: SITE_URL, e.g. https://crew-health-navigator.onrender.com (no slash at the end).
name: Keep the site awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 "${SITE_URL}/health"
